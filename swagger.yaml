        '401':
          $ref: '#/components/responses/Error401'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from login / refreshToken
    apikeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Value: `Apikey <SEPAY_APIKEY>`'

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 10

  responses:
    Error400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        data:
          nullable: true

    # ------------------------------------------------------------------
    # AUTH / USER
    # ------------------------------------------------------------------
    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    User:
      type: object
      properties:
        id:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        dob:
          type: string
          format: date
        phone_number:
          type: string
        gender:
          type: string
        role:
          type: string
          enum: [ADMIN, USER, SUPERADMIN, STAFF]
        avatar:
          type: string
          nullable: true
        is_new:
          type: boolean
        membership_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserCreateRequest:
      type: object
      required: [first_name, last_name, email, dob, phone_number, gender, password, membership_id]
      properties:
        address:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        dob:
          type: string
          format: date
        phone_number:
          type: string
        gender:
          type: string
        password:
          type: string
          format: password
        membership_id:
          type: string
          enum: [BRONZE, SILVER, GOLD, PLATINUM, VIP]
        avatar:
          type: string
          nullable: true

    # ------------------------------------------------------------------
    # PRODUCT / VARIANT
    # ------------------------------------------------------------------
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        base_price:
          type: number
        description:
          type: string
          nullable: true
        brand:
          type: string
          nullable: true
        category:
          type: string
        is_deleted:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'

    ProductVariant:
      type: object
      properties:
        id:
          type: string
        product_id:
          type: string
        size:
          type: integer
        color:
          type: string
        stock:
          type: integer
        price:
          type: number
        image:
          type: string
          nullable: true
        is_deleted:
          type: boolean

    VariantInput:
      type: object
      required: [size, color, stock, price]
      properties:
        size:
          type: integer
        color:
          type: string
        stock:
          type: integer
        price:
          type: number
        image:
          type: string
          nullable: true

    ProductCreateRequest:
      type: object
      required: [name, category, variants]
      properties:
        name:
          type: string
        description:
          type: string
        brand:
          type: string
        category:
          type: string
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VariantInput'

    ProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        brand:
          type: string
        category:
          type: string
        variants:
          type: array
          description: Additional variants to append
          items:
            $ref: '#/components/schemas/VariantInput'

    VariantCreateRequest:
      type: object
      required: [product_id, size, color, stock, price]
      properties:
        product_id:
          type: string
        size:
          type: integer
        color:
          type: string
        stock:
          type: integer
        price:
          type: number
        image:
          type: string
          nullable: true

    VariantUpdateRequest:
      type: object
      properties:
        product_id:
          type: string
        size:
          type: integer
        color:
          type: string
        stock:
          type: integer
        price:
          type: number
        image:
          type: string
          nullable: true

    # ------------------------------------------------------------------
    # CART
    # ------------------------------------------------------------------
    Cart:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        amount:
          type: integer
          description: Total quantity of items
        total_price:
          type: number
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'

    CartItem:
      type: object
      properties:
        id:
          type: integer
        cart_id:
          type: string
        variant_id:
          type: string
        quantity:
          type: integer
        total_price:
          type: number
        variant:
          $ref: '#/components/schemas/ProductVariant'

    CartItemAddRequest:
      type: object
      required: [variant_id, quantity]
      properties:
        variant_id:
          type: string
        quantity:
          type: integer
          minimum: 1

    CartCoupon:
      type: object
      properties:
        id:
          type: integer
        cart_id:
          type: string
        coupon_id:
          type: string
        applied_at:
          type: string
          format: date-time
        coupon:
          $ref: '#/components/schemas/Coupon'

    # ------------------------------------------------------------------
    # COUPON / CONDITION
    # ------------------------------------------------------------------
    Coupon:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        type:
          type: string
          enum: [PERCENT, FIXED]
        usage_limit:
          type: integer
        used_count:
          type: integer
        value:
          type: number
        max_discount:
          type: number
          nullable: true
        condition_set_id:
          type: string
        conditionSet:
          $ref: '#/components/schemas/ConditionSet'

    ConditionDetailInput:
      type: object
      required: [condition_type, condition_value]
      properties:
        condition_type:
          type: string
          enum: [TIER, MIN_ORDER_VALUE, NEW_USER, DAY_OF_WEEK, HOUR_OF_DAY]
        condition_value:
          type: string
          description: e.g. GOLD / 500000 / 1 / 5 / 18-21

    CouponCreateRequest:
      type: object
      required: [code, start_time, end_time, type, value, condition_set_id]
      properties:
        code:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        type:
          type: string
          enum: [PERCENT, FIXED]
        usage_limit:
          type: integer
          default: 1
        value:
          type: number
        max_discount:
          type: number
          nullable: true
        condition_set_id:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/ConditionDetailInput'

    CouponUpdateRequest:
      type: object
      properties:
        code:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        type:
          type: string
          enum: [PERCENT, FIXED]
        usage_limit:
          type: integer
        value:
          type: number
        max_discount:
          type: number
          nullable: true
        condition_set_id:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/ConditionDetailInput'

    ConditionSet:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        is_reusable:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        details:
          type: array
          items:
            $ref: '#/components/schemas/ConditionDetail'

    ConditionDetail:
      type: object
      properties:
        condition_detail_id:
          type: integer
        condition_set_id:
          type: string
        condition_type:
          type: string
        condition_value:
          type: string

    ConditionSetCreateRequest:
      type: object
      required: [id, name, details]
      properties:
        id:
          type: string
          description: e.g. SET_GOLD_1M
        name:
          type: string
        is_reusable:
          type: boolean
        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ConditionDetailInput'

    ConditionSetUpdateRequest:
      type: object
      properties:
        name:
          type: string
        is_reusable:
          type: boolean
        details:
          type: array
          description: Replaces all details if provided
          items:
            $ref: '#/components/schemas/ConditionDetailInput'

    # ------------------------------------------------------------------
    # MEMBERSHIP
    # ------------------------------------------------------------------
    MembershipTier:
      type: object
      properties:
        id:
          type: string
          description: e.g. GOLD
        name:
          type: string
        min_points:
          type: integer
        discount_rate:
          type: number
        is_deleted:
          type: boolean

    MembershipTierCreateRequest:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        min_points:
          type: integer
          default: 0
        discount_rate:
          type: number
          default: 0

    MembershipTierUpdateRequest:
      type: object
      properties:
        name:
          type: string
        min_points:
          type: integer
        discount_rate:
          type: number

    # ------------------------------------------------------------------
    # ADDRESS
    # ------------------------------------------------------------------
    UserAddress:
      type: object
      properties:
        address_id:
          type: integer
        user_id:
          type: string
        full_address:
          type: string
        is_default:
          type: boolean
        label:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserAddressCreateRequest:
      type: object
      required: [full_address, label]
      properties:
        full_address:
          type: string
        label:
          type: string
          example: Home
        is_default:
          type: boolean
          default: false

    UserAddressUpdateRequest:
      type: object
      properties:
        full_address:
          type: string
        label:
          type: string
        is_default:
          type: boolean

    # ------------------------------------------------------------------
    # ORDER / PAYMENT
    # ------------------------------------------------------------------
    Order:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        cart_id:
          type: string
          nullable: true
        quantity:
          type: integer
        total_price:
          type: number
        status:
          type: string
          enum: [Pending, Processing, Shipping, Delivered, Completed, Cancelled, Failed]
        method:
          type: string
          enum: [Cast, Bank]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    OrderItem:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: string
        variant_id:
          type: string
        quantity:
          type: integer
        price_per_unit:
          type: number

    OrderCreateRequest:
      type: object
      required: [items]
      properties:
        cart_id:
          type: string
          nullable: true
        method:
          type: string
          enum: [Cast, Bank]
          default: Cast
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [variant_id, quantity, price_per_unit]
            properties:
              variant_id:
                type: string
              quantity:
                type: integer
              price_per_unit:
                type: number

    PaymentCreateRequest:
      type: object
      required: [description, amount, orderId]
      properties:
        description:
          type: string
          description: Transfer content, used to map back to the order
        amount:
          type: number
        orderId:
          type: string

    Favorite:
      type: object
      properties:
        favorite_id:
          type: integer
        user_id:
          type: string
        product_id:
          type: string
        product:
          $ref: '#/components/schemas/Product'

    # ------------------------------------------------------------------
    # REPORT / WEBHOOK
    # ------------------------------------------------------------------
    OverviewReport:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            summary:
              type: object
              properties:
                totalRevenue:
                  type: number
                totalOrders:
                  type: integer
                newUsers:
                  type: integer
                returnCancelRate:
                  type: number
            revenueByMonth:
              type: array
              items:
                type: object
                properties:
                  month:
                    type: integer
                  revenue:
                    type: number
                  orders:
                    type: integer
            topProducts:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  sold:
                    type: integer
            categoryRevenue:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  value:
                    type: number
            orderStatusBreakdown:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  value:
                    type: integer
            newUsersByMonth:
              type: array
              items:
                type: object
                properties:
                  month:
                    type: integer
                  users:
                    type: integer

    WebhookPayload:
      type: object
      properties:
        id:
          type: integer
        gateway:
          type: string
        transactionDate:
          type: string
          format: date-time
        accountNumber:
          type: string
        code:
          type: string
          nullable: true
          description: Order code (e.g. OD000001)
        content:
          type: string
        transferType:
          type: string
        transferAmount:
          type: number
        accumulated:
          type: number
        subAccount:
          type: string
          nullable: true
        referenceCode:
          type: string
        description:
          type: string
