openapi: 3.0.0
info:
  title: GenZStyle API Documentation
  description: REST API for the GenZStyle shoe shop (Auth, Product, Cart, Order, Payment, Coupon, Membership, Report...). All protected routes require `Authorization: Bearer <token>`.
  version: 1.0.0
  contact:
    name: GenZStyle Team

servers:
  - url: http://localhost:5000
    description: Local Development Server

tags:
  - name: Auth
    description: Authentication endpoints
  - name: User
    description: User management (admin)
  - name: Product
    description: Product catalog
  - name: Variant
    description: Product variants (size / color / stock)
  - name: Cart
    description: Shopping cart
  - name: CartCoupon
    description: Coupons applied on a cart
  - name: Coupon
    description: Coupon management and apply
  - name: Favorite
    description: Wishlist / favorites
  - name: Membership
    description: Membership tiers
  - name: Address
    description: User shipping addresses
  - name: Order
    description: Orders
  - name: Payment
    description: Payments (SePay QR)
  - name: ConditionSet
    description: Coupon condition sets
  - name: History
    description: Purchase history
  - name: Report
    description: Admin reports
  - name: Webhook
    description: SePay webhook

paths:
  # ==================================================================
  # AUTH
  # ==================================================================
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email & password
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successfully
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user (multipart; optional avatar file)
      operationId: authRegister
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [first_name, last_name, email, password, phone_number, birthday, gender, address]
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                phone_number:
                  type: string
                birthday:
                  type: string
                  format: date
                gender:
                  type: string
                  example: MALE
                address:
                  type: string
                file:
                  type: string
                  format: binary
                  description: Optional avatar image (jpg/jpeg/png/webp, max 5MB)
      responses:
        '201':
          description: Register success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Register successfully
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      refresh_token:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error400'

  /api/v1/auth/refreshToken:
    post:
      tags: [Auth]
      summary: Refresh access token using current (refresh) token
      operationId: authRefreshToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Token refreshed successfully
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
        '401':
          $ref: '#/components/responses/Error401'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke refresh token)
      operationId: authLogout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logout successfully

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      operationId: authMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error401'

  # ==================================================================
  # USER (admin)
  # ==================================================================
  /api/v1/user/getAll:
    get:
      tags: [User]
      summary: Get all users (paged) - ADMIN
      operationId: userGetAll
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentPage:
                    type: integer
                  totalPage:
                    type: integer
                  totalUser:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'

  /api/v1/user/get/{id}:
    get:
      tags: [User]
      summary: Get user by id - ADMIN / USER
      operationId: userGetById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/Error404'

  /api/v1/user/create:
    post:
      tags: [User]
      summary: Create user - ADMIN
      operationId: userCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error400'

  /api/v1/user/update/{id}:
    patch:
      tags: [User]
      summary: Update user (multipart, optional avatar file) - ADMIN / USER
      operationId: userUpdate
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                dob:
                  type: string
                  format: date
                phone_number:
                  type: string
                gender:
                  type: string
                file:
                  type: string
                  format: binary
                  description: New avatar image (jpg/jpeg/png/webp, max 5MB)
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error400'

  /api/v1/user/delete/{id}:
    delete:
      tags: [User]
      summary: Soft-delete user - ADMIN
      operationId: userDelete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User deleted successfully
                  data:
                    type: null
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  # ==================================================================
  # PRODUCT
  # ==================================================================
  /api/v1/product/:
    get:
      tags: [Product]
      summary: Get all products (paged, public)
      operationId: productGetAll
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentPage:
                    type: integer
                  totalPage:
                    type: integer
                  totalProduct:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

  /api/v1/product/search:
    get:
      tags: [Product]
      summary: Advanced product search (public)
      operationId: productSearch
      parameters:
        - name: name
          in: query
          schema:
            type: string
        - name: brand
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: size
          in: query
          schema:
            type: number
        - name: color
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentPage:
                    type: integer
                  totalPage:
                    type: integer
                  totalProduct:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

  /api/v1/product/{id}:
    get:
      tags: [Product]
      summary: Get product by id with variants (public)
      operationId: productGetById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/Error404'

  /api/v1/product/create:
    post:
      tags: [Product]
      summary: Create product with variants (public)
      operationId: productCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/Error400'

  /api/v1/product/update/{id}:
    post:
      tags: [Product]
      summary: Update product, optionally append variants - ADMIN
      operationId: productUpdate
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/Error400'

  /api/v1/product/delete/{id}:
    delete:
      tags: [Product]
      summary: Soft-delete product - ADMIN
      operationId: productDelete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted (no content)
        '404':
          $ref: '#/components/responses/Error404'

  # ==================================================================
  # VARIANT
  # ==================================================================
  /api/v1/variant/:
    get:
      tags: [Variant]
      summary: Get all variants (paged, public)
      operationId: variantGetAll
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated variant list
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentPage:
                    type: integer
                  totalPage:
                    type: integer
                  totalVariant:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductVariant'

  /api/v1/variant/{id}:
    get:
      tags: [Variant]
      summary: Get variant by id (public)
      operationId: variantGetById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Variant found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductVariant'
        '404':
          $ref: '#/components/responses/Error404'

  /api/v1/variant/create:
    post:
      tags: [Variant]
      summary: Create a variant (public)
      operationId: variantCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantCreateRequest'
      responses:
        '201':
          description: Variant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductVariant'

  /api/v1/variant/autoCreate:
    post:
      tags: [Variant]
      summary: Create variant or add stock when same size/color/price exists (public)
      operationId: variantAutoCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantCreateRequest'
      responses:
        '200':
          description: Variant created / updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductVariant'

  /api/v1/variant/update/{id}:
    patch:
      tags: [Variant]
      summary: Update a variant (public)
      operationId: variantUpdate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantUpdateRequest'
      responses:
        '200':
          description: Variant updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductVariant'
        '404':
          $ref: '#/components/responses/Error404'

  /api/v1/variant/delete/{id}:
    delete:
      tags: [Variant]
      summary: Soft-delete a variant (public)
      operationId: variantDelete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted (no content)
        '404':
          $ref: '#/components/responses/Error404'

  # ==================================================================
  # CART
  # ==================================================================
  /api/v1/cart/:
    get:
      tags: [Cart]
      summary: Get (or create) the current user's cart
      operationId: cartGet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Cart'

  /api/v1/cart/items:
    post:
      tags: [Cart]
      summary: Add a variant to the cart
      operationId: cartAddItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemAddRequest'
      responses:
        '201':
          description: Item added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/Error400'

    delete:
      tags: [Cart]
      summary: Remove an item from the cart
      operationId: cartRemoveItem
      security:
        - bearerAuth: []
      parameters:
        - name: cartItemId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/Error404'

  /api/v1/cart/items/{cartItemId}:
    put:
      tags: [Cart]
      summary: Update quantity / variant of a cart item
      operationId: cartUpdateItem
      security:
        - bearerAuth: []
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                variantId:
                  type: string
      responses:
        '200':
          description: Item updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/CartItem'

  # ==================================================================
  # CART COUPONS (mounted under /api/v1/cart/coupons)
  # ==================================================================
  /api/v1/cart/coupons:
    get:
      tags: [CartCoupon]
      summary: Get coupons applied to the current user's cart
      operationId: cartCouponGet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Applied coupons
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Coupon'

    post:
      tags: [CartCoupon]
      summary: Apply a coupon to the current user's cart
      operationId: cartCouponApply
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coupon_code]
              properties:
                coupon_code:
                  type: string
      responses:
        '201':
          description: Coupon applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/CartCoupon'
        '400':
          $ref: '#/components/responses/Error400'

  /api/v1/cart/coupons/{couponId}:
    delete:
      tags: [CartCoupon]
      summary: Remove a coupon from the current user's cart
      operationId: cartCouponRemove
      security:
        - bearerAuth: []
      parameters:
        - name: couponId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Coupon removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  # ==================================================================
  # COUPON
  # ==================================================================
  /api/v1/coupon/:
    get:
      tags: [Coupon]
      summary: Get all coupons (paged, with search)
      operationId: couponGetAll
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated coupon list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Coupon'
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer

  /api/v1/coupon/create:
    post:
      tags: [Coupon]
      summary: Create a coupon with optional conditions
      operationId: couponCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponCreateRequest'
      responses:
        '201':
          description: Coupon created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Coupon'
        '400':
          $ref: '#/components/responses/Error400'

  /api/v1/coupon/update/{id}:
    put:
      tags: [Coupon]
      summary: Update coupon (and its conditions)
      operationId: couponUpdate
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponUpdateRequest'
      responses:
        '200':
          description: Coupon updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Coupon'
        '400':
          $ref: '#/components/responses/Error400'

  /api/v1/coupon/delete/{id}:
    delete:
      tags: [Coupon]
      summary: Soft-delete a coupon
      operationId: couponDelete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Coupon deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/Error400'

  /api/v1/coupon/get-all-by-user-id:
    get:
      tags: [Coupon]
      summary: Get coupons available to the current user
      operationId: couponGetByUserId
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Available coupons
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Coupon'

  /api/v1/coupon/get-by-code/{code}:
    get:
      tags: [Coupon]
      summary: Get coupon details by code
      operationId: couponGetByCode
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Coupon found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Coupon'
        '404':
          $ref: '#/components/responses/Error404'

  /api/v1/coupon/apply-coupon:
    post:
      tags: [Coupon]
      summary: Apply a coupon and get the computed discount
      operationId: couponApply
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Coupon applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      discountAmount:
                        type: number
                      couponCode:
                        type: string
        '400':
          $ref: '#/components/responses/Error400'

  # ==================================================================
  # FAVORITE
  # ==================================================================
  /api/v1/favorite/:
